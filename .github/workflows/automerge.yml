# automerge.yml -- ARM auto-merge on a non-draft PR; branch protection decides. realisateur#931
name: automerge

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write   # #965: pay-the-carry step below dispatches tests.yml and roster-image.yml

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest   # public repo: free minutes, and not queued behind monkey
    steps:
      - name: enable auto-merge
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          set -euo pipefail
          body=$(jq -nc --arg pr "$PR_ID" '{query:"mutation($pr:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pr,mergeMethod:SQUASH}){clientMutationId}}",variables:{pr:$pr}}')
          for attempt in $(seq 1 40); do   # 10 min: the mutation errors `unstable status` while checks run, and groc-mangr#109 gave up at 6x20s while `suites` (~2m20s) was still going
            resp=$(curl -fsS -X POST https://api.github.com/graphql \
                     -H "Authorization: bearer $TOKEN" -d "$body")
            if jq -e 'has("errors") | not' >/dev/null <<<"$resp"; then
              echo "armed on attempt $attempt"; exit 0
            fi
            printf '%s\n' "$resp"
            sleep 15
          done
          echo "not armed after 40 attempts -- retry with: gh pr merge --auto --squash" >&2
          exit 1

      - name: pay the carry once the merge lands (#965 -- this merge fires no push event, so tests.yml's carry job never runs on its own)
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do   # 30 min: #1039 merged at 13m09s against the old 10 min budget -- 6 same-day PRs sharing the runner queue was enough to blow it, and a merge this loop misses reddens every open PR (#592) until paid by hand
            merged=$(curl -fsS -H "Authorization: bearer $TOKEN" \
                       "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" | jq -r '.merged')
            if [ "$merged" = "true" ]; then
              curl -fsS -X POST -H "Authorization: bearer $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/workflows/tests.yml/dispatches" \
                -d '{"ref":"main"}'   # explicit workflow_dispatch is the one event the token-recursion suppression exempts
              echo "dispatched tests.yml on attempt $attempt"

              files=$(curl -fsS -H "Authorization: bearer $TOKEN" \
                        "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" | jq -r '.[].filename')
              if grep -qE '^(provision/dexter/roster/|\.github/workflows/roster-image\.yml)' <<<"$files"; then   # realisateur#1080: same push-suppression as tests.yml -- #1106 merged but never rebuilt ghcr.io/hf7y/roster
                curl -fsS -X POST -H "Authorization: bearer $TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/workflows/roster-image.yml/dispatches" \
                  -d '{"ref":"main"}'
                echo "dispatched roster-image.yml on attempt $attempt"
              fi
              exit 0
            fi
            sleep 15
          done
          echo "PR not merged after 30 min -- carry not dispatched; pay by hand: gh workflow run tests.yml" >&2
          exit 0
