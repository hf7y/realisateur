# claim-drift.yml -- the surfacing half of bin/claim-drift.sh.
#
# WHY A SEPARATE WORKFLOW. bin/claim-drift.sh answers "has this PR grown since
# it was presented as done?". Left as a command, that answer only exists when
# somebody remembers to ask -- which is the prose discipline it was built to
# replace, wearing a shell script. This is what makes it fire on its own.
#
# IT SURFACES; IT DOES NOT BLOCK. Not a required check on main. It once could
# not be one -- private repo, branch-protection API answering 403 (2026-08-07)
# -- but the repo went public 2026-08-19 and the judgement outlived its cause:
# growth after "done" is legitimate, and blocking would forbid it. Growth that
# leaves the claim standing is what this makes impossible to do quietly.
#
# THE EVENT LIST IS LOAD-BEARING. `ready_for_review` and `converted_to_draft`
# are NOT in the default `pull_request` set. Without them the two acts that
# CHANGE the answer -- withdrawing a claim, and re-making it -- would never
# re-run the check, so a PR could stay red after it had been legitimately
# re-committed to, and a stale claim would be the one thing that never
# refreshed. bin/tests/claim-drift.test.sh case I2 pins all three.

name: claim-drift

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --strict so drift is a red check rather than a line in a log nobody
      # opens. BLIND (exit 6) is also red: a run that could not read the
      # tracker has not established that the claim is fresh.
      - name: Is this PR still what was claimed?
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/claim-drift.sh --strict --repo "$GITHUB_REPOSITORY" "${{ github.event.number }}"
