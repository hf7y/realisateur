# tests.yml -- run the suites in bin/tests/ on every pull request and on every
# push to main.
#
# WHY THIS EXISTS. Before it, .github/workflows/verb-build-smoke.yml was the
# only workflow in the repository and it ran 2 of the suites in bin/tests/,
# behind a `paths:` filter that excluded most of the tree. Every other suite in
# that directory had no automated runner at all. They were real tests, they
# passed, and nothing ever ran them, which makes them documentation. This file
# is the difference between a test that exists and a test that gates.
# (`git log -- .github/workflows/verb-build-smoke.yml` has the roster as it
# stood; naming it here would be the same append point, one sentence smaller.)
#
# THIS HEADER NAMES NO SUITE, AND bin/suite-docs-lint.sh ENFORCES THAT.
#
# It used to. It carried one hand-written paragraph per file in bin/tests/,
# describing what makes that suite hermetic -- and every PR that added a suite
# appended to the same forty lines. On 2026-08-07 three open PRs did exactly
# that and produced three merge conflicts in one day, every one of them in this
# file and in no other file in the repository: #97 merging broke #95 and #96,
# and #95 merging broke #96 again after it had already been resolved once.
#
# The ledger was prose restating what the loop below already knows, because the
# loop GLOBS. Each note now lives in the header of the suite it describes --
# a file only the PR that adds that suite touches, so there is nothing to
# contend for. `bin/suite-docs-lint.sh` asserts both halves: every suite still
# carries a `# HERMETICITY:` note, and this file names no suite. It runs from
# the very glob that made the ledger redundant.
#
# No suite count is stated here, on purpose: this header read "all nine" for
# two suites longer than it was true. A number maintained by hand is the same
# defect as a list maintained by hand, in one word.
#
# THE BAR, unchanged and the whole point. Editing a test so a new workflow can
# open green is the exact move this repository's BUILD-DISCIPLINE.md exists to
# prevent. Fixing a harness that tests the wrong thing is not that, and neither
# is fixing shipped code. Nothing here weakens an assertion: what moved was
# prose, and the guard above is what stops it moving back.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Several suites commit into fixture repositories. Most set an identity
      # per repo or per command, but a runner has no global one at all, so
      # anything that does not is a confusing "empty ident name" failure that
      # has nothing to do with the assertion under test.
      - name: Give git an identity for fixture commits
        run: |
          git config --global user.email "ci@realisateur.invalid"
          git config --global user.name  "realisateur CI"
          git config --global init.defaultBranch main

      # Every suite runs. A suite that fails does not stop the ones after it --
      # one red assertion hiding eight other suites' results is how a run gets
      # reported as "the tests are broken" instead of as a list.
      - name: Run every suite in bin/tests/
        run: |
          set -uo pipefail
          failed=""
          ran=0
          for t in bin/tests/*.sh; do
            ran=$((ran + 1))
            echo "::group::$t"
            # `rc=0; cmd || rc=$?` and NOT `cmd; rc=$?`. GitHub runs a `run:`
            # block under `bash -eo pipefail`, so the plain form aborts the
            # whole step on the first failing suite -- which is precisely the
            # "one red assertion hides eight suites" failure this loop exists
            # to prevent, and it is invisible until a suite actually fails.
            # Measured: run 31153987276 stopped dead at the first suite and
            # never ran any of the ones after it.
            rc=0
            bash "$t" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$t::suite failed (exit $rc)"
              failed="$failed $t"
            fi
          done
          echo
          # A run that matched no suites is a broken glob, not a clean tree.
          # Reporting it as success is the "found nothing / nothing is wrong"
          # conflation this repository keeps paying for.
          if [ "$ran" -eq 0 ]; then
            echo "::error::bin/tests/*.sh matched nothing -- this run tested NOTHING."
            exit 2
          fi
          echo "ran $ran suite(s)."
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
          echo "all $ran suite(s) passed."

  # SHELLCHECK. A separate job from `suites` on purpose: the suite above
  # asserts that bin/shellcheck-lint.sh BEHAVES (its regression path fires, it
  # goes BLIND rather than green), which is what a container can honestly say
  # about a guard. THIS job runs the guard against the real tree, which is a
  # different claim and deserves its own red/green line.
  #
  # ubuntu-latest ships shellcheck preinstalled, so there is no install step to
  # rot. If that ever stops being true the guard exits 2 (BLIND) and this job
  # goes red -- which is the correct outcome, and the reason it was built to
  # distinguish "could not look" from "looked and found nothing".
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PIN THE VERSION. The ratchet is a COMPARISON, and comparing findings
      # across two shellcheck releases compares two different questions --
      # releases add checks, retire them, and change directive parsing. Live
      # example from the day this was written: 0.9.0 flags a comment line
      # beginning `# shellcheck` as a malformed directive and 0.10.0 does not,
      # so the same file is clean under one and carries two errors under the
      # other.
      #
      # ubuntu-latest happens to ship 0.9.0 today. Depending on that means the
      # baseline silently changes meaning the day GitHub bumps the image, and
      # the failure would land on whoever's PR was open at the time, looking
      # like their fault. So it is asserted, not assumed: if the runner drifts,
      # THIS step fails with a message naming the cause, instead of the ratchet
      # failing with a message about someone's branch.
      - name: Confirm the linter is present AND is the pinned version
        run: |
          shellcheck --version
          want="$(awk '/^# shellcheck-version /{print $3}' bin/shellcheck-lint.ratchet)"
          got="$(shellcheck --version | awk '/^version:/{print $2}')"
          if [ -z "$want" ]; then
            echo "::error::bin/shellcheck-lint.ratchet records no shellcheck-version -- re-accept it"
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::runner has shellcheck $got, ratchet was accepted with $want."
            echo "The baseline is not comparable across versions. Either pin the runner"
            echo "to $want, or re-accept the ratchet under $got and review what moved."
            exit 1
          fi
          echo "shellcheck $got matches the ratchet."
      - name: Ratchet -- fail only on a finding a file did not already have
        run: bash bin/shellcheck-lint.sh

  markdown-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The default range is $(git merge-base HEAD origin/main)..HEAD, so
      # origin/main has to actually exist as a remote-tracking ref. On a PR,
      # actions/checkout fetches the PR refs; main is not guaranteed among them
      # even at depth 0.
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Price the prose in this diff
        run: bash bin/markdown-cost.sh
