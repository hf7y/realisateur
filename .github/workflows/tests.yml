# tests.yml -- run the suites in bin/tests/ on every pull request and on every
# push to main.
#
# WHY THIS EXISTS. Before it, .github/workflows/verb-build-smoke.yml was the
# only workflow in the repository and it ran 2 of the 9 suites in bin/tests/,
# behind a `paths:` filter that excluded most of the tree. The other seven --
# closeout-lint, hygiene-lint, reach-lint, focus-commit, install-shims,
# verb-set, conf -- had no automated runner at all. They were real tests, they
# passed, and nothing ever ran them, which makes them documentation. This file
# is the difference between a test that exists and a test that gates.
#
# HERMETICITY, RE-PROBED RATHER THAN ASSUMED. The working assumption when this
# was commissioned was that hygiene-lint and closeout-lint read live machine
# state and could not run in a container. Reading them says otherwise, and it
# is worth writing down which mechanism makes each one safe, because that
# mechanism is what a future edit could quietly remove:
#
#   closeout-lint.test.sh  builds its own registry and sets SCHED_ROOT,
#                          FOCUS_MD, BLOCKERS_MD and TODAY on every invocation.
#   hygiene-lint.test.sh   sets SCHED_ROOT, and points SHIM_INSTALLER,
#                          REACH_LINT and SILENCE_AUDIT at throwaway stubs --
#                          which is precisely what makes checks 10/11/12
#                          (the three that DO shell out to live-state tools)
#                          deterministic here.
#   reach-lint.test.sh     sets SCHED_ROOT and points USER_CMD_DIR at a
#                          directory that deliberately does not exist.
#   verb-set.test.sh       exports INSTALLE_PROJECTS / INSTALLE_BIN /
#                          INSTALLE_MANIFEST / SCHEDULE_DIR into a temp dir.
#   conf.test.sh           overrides HOME and SCHED_ROOT.
#   install-shims.test.sh  passes BIN_DEST / CMD_DEST into a temp dir.
#   focus-commit.test.sh   builds bare remotes and clones in a temp dir.
#   markdown-cost.test.sh  builds a throwaway repo per case.
#   hardcoded-home-lint.test.sh
#                          builds a throwaway repo per case, and its one
#                          assertion about live state (I3, "this repository
#                          is clean") is about the checkout, not the machine.
#
# All of them are therefore wired. If any of them ever needs a real
# ~/.local/bin, a real scheduler registry or a real network, the honest fix is
# to give it a fixture -- NOT to drop it from this list, and never to weaken
# the assertion.
#
# WAS KNOWN RED; CLOSED 2026-08-07. Three suites failed from the day this
# workflow was created -- closeout-lint (46/3), install-shims (8/3), verb-set
# (30/4), measured on run 31217552355. They are fixed, and the forensics stay
# here because the SHAPE of each recurs and the diagnosis of one was wrong.
#
# The common thread, and the reason all three failed at once: a test that
# reaches live machine state passes on the machine that has it and proves
# nothing anywhere. Two of the three had been green for months by reading
# ~zach rather than the branch under test. Wiring them to CI is what made
# them say so.
#
#   closeout-lint.test.sh -- CONFIRMED as diagnosed, and there were TWO stale
#     fixtures, not one. 957b8b8 (#65) gave closeout-lint.sh both an
#     `on_a_remote` stale-pointer exemption and an `other-worktree` skip, and
#     the suite was last touched before it. (a) `detached`'s `orphan` branch
#     sat at main's tip, so its tip WAS reachable from a remote and the
#     downgrade to `note [stale-pointer]` was correct -- A4 asked for a state
#     the fixture stopped building. (b) E3's only host-only branch in
#     `oldrepo` was `oldside`, which A9 puts in a linked worktree, so the new
#     skip correctly declined to examine it. The script was right both times.
#     Fixed by giving `orphan` a commit on no remote and `oldrepo` a plain
#     host-only branch. No assertion text changed. Now 49/0.
#
#   install-shims.test.sh -- CONFIRMED, and the one-line fix uncovered two
#     more defects behind it. `run_shims` passed only BIN_DEST and CMD_DEST,
#     so REPO fell back to $HOME/Documents/Projects/realisateur and section D
#     audited the LIVE SHARED CHECKOUT instead of the branch. Passing REPO
#     then exposed: (1) install-shims.sh tested `-d "$REPO/.git"`, but in a
#     linked worktree .git is a FILE, so it refused every worktree as "not a
#     realisateur checkout" -- and every agent in this repo works in
#     .claude/worktrees/*. Now `-e`, with E4/E5 pinning it. (2) With REPO
#     passed, the run reaches the hook section, and HOOK_DEST/CLAUDE_SETTINGS
#     were NOT redirected -- so the suite would have written into the real
#     ~/.claude/hooks. Both overrides added. Now 13/0.
#
#   verb-set.test.sh -- REFUTED as written above, which is the lesson. The
#     hardcoded `SCHED="/home/zach/Documents/Projects/scheduler"` was real,
#     but c8fc45e (#89) had ALREADY fixed it and said in its own message that
#     it did not fix E2..E5. The remaining red was the HARNESS: section E
#     drives `coin scheduler ...` and never registered `scheduler` in its own
#     fixture registry -- it relied on the live one, which is exactly why it
#     was green only on zach's box, and #89 is what stopped that working.
#     `register scheduler` fixes it; no assertion changed. Fixed alongside:
#     coin.sh now honours SCHEDULE_DIR, the same name bin/install-verbs.sh
#     reads, instead of retyping the registry join, and reports BLIND rather
#     than "no registered project" when the registry directory is absent.
#     Now 34/0.
#
# THE FINDING WORTH MORE THAN THE THREE FIXES. bin/hardcoded-home-lint.sh --
# written for the coin.sh defect above (#91) -- reported "72 tracked files, no
# hardcoded home in code" while `bashify/bin/bashify:32-33` still carried
# `/home/zach/Documents/Projects/{basheur,scheduler}`. It selected
# `'*.sh' 'bin/*'`, which does not match an extensionless executable outside
# the repo-root bin/, so the front door of the very family the guard was
# written about was never scanned. It also had no test and no runner: nothing
# in bin/tests/ and nothing here ever executed it. Both closed --  it now
# selects by shebang, bashify's paths are resolved, and
# bin/tests/hardcoded-home-lint.test.sh gates it from this workflow, H5
# mutation-verified against the old selection.
#
# THE BAR, unchanged and the whole point. Editing a test so a new workflow can
# open green is the exact move this repository's BUILD-DISCIPLINE.md exists to
# prevent. Fixing a harness that tests the wrong thing is not that, and
# neither is fixing shipped code. Nothing above weakened an assertion: every
# assertion string that was red is still red-able, and the suites gained ten
# checks between them.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Several suites commit into fixture repositories. Most set an identity
      # per repo or per command, but a runner has no global one at all, so
      # anything that does not is a confusing "empty ident name" failure that
      # has nothing to do with the assertion under test.
      - name: Give git an identity for fixture commits
        run: |
          git config --global user.email "ci@realisateur.invalid"
          git config --global user.name  "realisateur CI"
          git config --global init.defaultBranch main

      # Every suite runs. A suite that fails does not stop the ones after it --
      # one red assertion hiding eight other suites' results is how a run gets
      # reported as "the tests are broken" instead of as a list.
      - name: Run every suite in bin/tests/
        run: |
          set -uo pipefail
          failed=""
          ran=0
          for t in bin/tests/*.sh; do
            ran=$((ran + 1))
            echo "::group::$t"
            # `rc=0; cmd || rc=$?` and NOT `cmd; rc=$?`. GitHub runs a `run:`
            # block under `bash -eo pipefail`, so the plain form aborts the
            # whole step on the first failing suite -- which is precisely the
            # "one red assertion hides eight suites" failure this loop exists
            # to prevent, and it is invisible until a suite actually fails.
            # Measured: run 31153987276 stopped dead at closeout-lint and
            # never ran the nine after it.
            rc=0
            bash "$t" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$t::suite failed (exit $rc)"
              failed="$failed $t"
            fi
          done
          echo
          # A run that matched no suites is a broken glob, not a clean tree.
          # Reporting it as success is the "found nothing / nothing is wrong"
          # conflation this repository keeps paying for.
          if [ "$ran" -eq 0 ]; then
            echo "::error::bin/tests/*.sh matched nothing -- this run tested NOTHING."
            exit 2
          fi
          echo "ran $ran suite(s)."
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
          echo "all $ran suite(s) passed."

  markdown-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The default range is $(git merge-base HEAD origin/main)..HEAD, so
      # origin/main has to actually exist as a remote-tracking ref. On a PR,
      # actions/checkout fetches the PR refs; main is not guaranteed among them
      # even at depth 0.
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Price the prose in this diff
        run: bash bin/markdown-cost.sh
