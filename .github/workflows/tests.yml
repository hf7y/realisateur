# tests.yml -- run the suites in bin/tests/ on every pull request and on every
# push to main.
#
# WHY THIS EXISTS. Before it, .github/workflows/verb-build-smoke.yml was the
# only workflow in the repository and it ran 2 of the 9 suites in bin/tests/,
# behind a `paths:` filter that excluded most of the tree. The other seven --
# closeout-lint, hygiene-lint, reach-lint, focus-commit, install-shims,
# verb-set, conf -- had no automated runner at all. They were real tests, they
# passed, and nothing ever ran them, which makes them documentation. This file
# is the difference between a test that exists and a test that gates.
#
# HERMETICITY, RE-PROBED RATHER THAN ASSUMED. The working assumption when this
# was commissioned was that hygiene-lint and closeout-lint read live machine
# state and could not run in a container. Reading them says otherwise, and it
# is worth writing down which mechanism makes each one safe, because that
# mechanism is what a future edit could quietly remove:
#
#   closeout-lint.test.sh  builds its own registry and sets SCHED_ROOT,
#                          FOCUS_MD, BLOCKERS_MD and TODAY on every invocation.
#   hygiene-lint.test.sh   sets SCHED_ROOT, and points SHIM_INSTALLER,
#                          REACH_LINT and SILENCE_AUDIT at throwaway stubs --
#                          which is precisely what makes checks 10/11/12
#                          (the three that DO shell out to live-state tools)
#                          deterministic here.
#   reach-lint.test.sh     sets SCHED_ROOT and points USER_CMD_DIR at a
#                          directory that deliberately does not exist.
#   verb-set.test.sh       exports INSTALLE_PROJECTS / INSTALLE_BIN /
#                          INSTALLE_MANIFEST / SCHEDULE_DIR into a temp dir.
#   conf.test.sh           overrides HOME and SCHED_ROOT.
#   install-shims.test.sh  passes BIN_DEST / CMD_DEST into a temp dir.
#   focus-commit.test.sh   builds bare remotes and clones in a temp dir.
#   markdown-cost.test.sh  builds a throwaway repo per case.
#
# All nine are therefore wired. If any of them ever needs a real ~/.local/bin,
# a real scheduler registry or a real network, the honest fix is to give it a
# fixture -- NOT to drop it from this list, and never to weaken the assertion.
#
# KNOWN RED, and deliberately left red. Three suites fail. Every one of them
# is a real defect this workflow found, and not one is a reason to drop a
# suite from the list -- measured on run 31154095796, 2026-08-07.
#
#   closeout-lint.test.sh -- 46 passed, 3 failed (A4 x2, E3). NOT an
#     environment effect: it reproduces on a developer machine. The `detached`
#     fixture makes branch `orphan` at main's tip, and closeout-lint.sh's
#     stale-pointer exemption (`on_a_remote`) correctly downgrades a branch
#     whose tip is already reachable from a remote ref to
#     `note [stale-pointer]` instead of `FLAG [host-only-branch]`. The script
#     is behaving as designed; the FIXTURE predates the exemption and no
#     longer builds a genuinely host-only branch. One line to fix: give
#     `orphan` a commit that exists on no remote.
#
#   install-shims.test.sh -- 8 passed, 3 failed (D2, D3, D5). This one is
#     worth reading twice. Line 18 sets REPO to the checkout under test, but
#     `run_shims` (line 37) passes only BIN_DEST and CMD_DEST to the script,
#     and REPO is never exported. So install-shims.sh falls back to its own
#     default, bin/install-shims.sh:40:
#         REPO="${REPO:-${INSTALLE_PROJECTS:-$HOME/Documents/Projects}/realisateur}"
#     On Zach's machine that path exists, so section D passes -- by auditing
#     the LIVE SHARED CHECKOUT instead of the branch under test. A green D on
#     a developer machine was never evidence about this branch's code. In a
#     container the path does not exist and install-shims.sh exits 5, which is
#     precisely the dexter bootstrap failure the suite's OWN section E exists
#     to pin. One line to fix: pass REPO="$REPO" in `run_shims`.
#
#   verb-set.test.sh -- 30 passed, 4 failed (E2..E5). Section E drives
#     bashify/lib/coin.sh, and bashify/lib/coin.sh:31 is:
#         SCHED="/home/zach/Documents/Projects/scheduler"
#     A hardcoded absolute path containing a username, with no environment
#     override at all -- so coin cannot resolve a project on ANY account that
#     is not zach, including the uid 3000-3099 accounts the monkey dispatch
#     runs under. In CI the path is absent, coin dies at exit 2 before it ever
#     reaches the claim check, and E2/E3/E5 miss their strings while E4 gets 2
#     where it wants 7. This is not a test defect; it is a production defect
#     the test could not see from Zach's home directory.
#
# All three are left for a human. Editing a test so a new workflow can open
# green is the exact move this repository's BUILD-DISCIPLINE.md exists to
# prevent, and the last two are findings about shipped code, not about tests.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Several suites commit into fixture repositories. Most set an identity
      # per repo or per command, but a runner has no global one at all, so
      # anything that does not is a confusing "empty ident name" failure that
      # has nothing to do with the assertion under test.
      - name: Give git an identity for fixture commits
        run: |
          git config --global user.email "ci@realisateur.invalid"
          git config --global user.name  "realisateur CI"
          git config --global init.defaultBranch main

      # Every suite runs. A suite that fails does not stop the ones after it --
      # one red assertion hiding eight other suites' results is how a run gets
      # reported as "the tests are broken" instead of as a list.
      - name: Run every suite in bin/tests/
        run: |
          set -uo pipefail
          failed=""
          ran=0
          for t in bin/tests/*.sh; do
            ran=$((ran + 1))
            echo "::group::$t"
            # `rc=0; cmd || rc=$?` and NOT `cmd; rc=$?`. GitHub runs a `run:`
            # block under `bash -eo pipefail`, so the plain form aborts the
            # whole step on the first failing suite -- which is precisely the
            # "one red assertion hides eight suites" failure this loop exists
            # to prevent, and it is invisible until a suite actually fails.
            # Measured: run 31153987276 stopped dead at closeout-lint and
            # never ran the nine after it.
            rc=0
            bash "$t" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$t::suite failed (exit $rc)"
              failed="$failed $t"
            fi
          done
          echo
          # A run that matched no suites is a broken glob, not a clean tree.
          # Reporting it as success is the "found nothing / nothing is wrong"
          # conflation this repository keeps paying for.
          if [ "$ran" -eq 0 ]; then
            echo "::error::bin/tests/*.sh matched nothing -- this run tested NOTHING."
            exit 2
          fi
          echo "ran $ran suite(s)."
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
          echo "all $ran suite(s) passed."

  markdown-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The default range is $(git merge-base HEAD origin/main)..HEAD, so
      # origin/main has to actually exist as a remote-tracking ref. On a PR,
      # actions/checkout fetches the PR refs; main is not guaranteed among them
      # even at depth 0.
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Price the prose in this diff
        run: bash bin/markdown-cost.sh
