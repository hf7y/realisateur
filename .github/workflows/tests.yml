# tests.yml -- run the suites in bin/tests/ on every pull request and on every
# push to main.
#
# WHY THIS EXISTS. Before it, verb-build-smoke.yml ran 2 of the suites behind a
# `paths:` filter that excluded most of the tree. The rest had no runner at
# all: real tests, passing, never run, which makes them documentation. This
# file is the difference between a test that exists and a test that gates.
#
# IT NAMES NO SUITE AND NO COUNT, because the step below GLOBS. The header
# used to carry a hand-written paragraph per file, and on 2026-08-07 three open
# PRs appended to the same forty lines and produced three merge conflicts in
# one day, every one of them here and nowhere else. A list maintained by hand
# is the same defect as a count maintained by hand.
#
#   (#631: two claims are gone from this header rather than restored. It said
#   `bin/suite-docs-lint.sh` enforced the no-suite rule -- that script was
#   deleted by #366 -- and that every suite carries a `# HERMETICITY:` note,
#   which 5 of 45 do. A header describing a guard that does not exist is worse
#   than no header: it reads as a gate.)
#
# THE BAR, unchanged. Editing a test so a new workflow can open green is the
# move this suite exists to catch. Fixing a harness that tests the wrong
# thing is not that, and neither is fixing shipped code.

name: tests

on:
  pull_request:
  push:
    branches: [main]

# One run per branch, here and in every workflow: 119 of 200 sampled runs
# were superseded and billed anyway (#401).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CARRY FIRST, ON MAIN ONLY. bin/tests/carry-drift.test.sh compares
  # origin/main against origin/bashified -- repo state, not the diff under
  # test -- so it went red on commits that touched no carried file, and stayed
  # red until a human ran the carry. main's CI was not a function of main, and
  # one owed carry blocked every open PR in the repo (#592).
  #
  # bin/carry.sh --apply is the actuator #636 gave it: plumbing only
  # (commit-tree + push), no checkout, and a no-op when nothing drifted. So the
  # state heals on the merge that owes the carry, and the suite below stops
  # being the thing that reports a debt nobody in-band can pay.
  #
  # It writes to `bashified`, never to `main` -- main is protected and this
  # would be refused anyway (CLAUDE.md).
  carry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch --no-tags origin +refs/heads/bashified:refs/remotes/origin/bashified
      - name: Give git an identity for the carry commit
        run: |
          git config --global user.email "ci@realisateur.invalid"
          git config --global user.name  "realisateur CI"
      - run: bash bin/carry.sh --apply

  suites:
    needs: [carry]
    # `needs` on a job that is skipped on pull_request would skip this one too.
    if: always() && (needs.carry.result == 'success' || needs.carry.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make origin/bashified resolvable
        run: git fetch --no-tags --depth=1 origin +refs/heads/bashified:refs/remotes/origin/bashified

      # Several suites commit into fixture repositories. Most set an identity
      # per repo or per command, but a runner has no global one at all, so
      # anything that does not is a confusing "empty ident name" failure that
      # has nothing to do with the assertion under test.
      - name: Give git an identity for fixture commits
        run: |
          git config --global user.email "ci@realisateur.invalid"
          git config --global user.name  "realisateur CI"
          git config --global init.defaultBranch main

      # bin/run-suites.sh does the looping and quarantine handling (#316).
      # that bin/tests/*.sh never matched (#157). Still a glob, not a roster.
      - name: Run every suite in bin/tests/
        run: bash bin/run-suites.sh bin/tests/*.sh

  # DEPLOY DRIFT. A separate job for the same reason shellcheck is one: it
  # makes a DIFFERENT claim, and it is the only job here that reaches the
  # network.
  #
  # WHY IT EXISTS. bin/tests/release-channel-wiring.test.sh section G has
  # compared provision/verbs-meta/build-verbs.yml against the copy deployed at
  # hf7y/verbs since it was written -- behind `--live`, which NOTHING EVER
  # PASSED. A sensor that exists and never runs is the estate's signature
  # defect, and on 2026-08-26 it cost exactly what it was built to prevent:
  # #645 removed the release gate from the SOURCE, the deploy did not happen in
  # the same change, and the deployed copy went on invoking a script that no
  # longer existed -- rc=127, state=BLIND, the cut step skipped on its GREEN
  # condition, and every night would have published a verdict and cut nothing.
  # ausculte's `propagation` probe is what noticed, a day later.
  #
  # NOT in `suites`: that job is hermetic by construction and must stay so. A
  # network call there would make every unrelated failure ambiguous.
  #
  # NOT a required check, deliberately. It reads another repository, so it goes
  # red on an outage that is nobody's PR -- and a required check that can be
  # broken by a third party is a wedge (realisateur#592's shape). It is loud
  # and it is advisory; the propagation probe is the one that pages.
  deploy-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Is the deployed workflow the one this repo develops?
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/tests/release-channel-wiring.test.sh --drift

  # SHELLCHECK. A separate job from `suites` on purpose: the suite above
  # asserts that bin/shellcheck-lint.sh BEHAVES (its regression path fires, it
  # goes BLIND rather than green), which is what a container can honestly say
  # about a guard. THIS job runs the guard against the real tree, which is a
  # different claim and deserves its own red/green line.
  #
  # ubuntu-latest ships shellcheck preinstalled, so there is no install step to
  # rot. If that ever stops being true the guard exits 2 (BLIND) and this job
  # goes red -- which is the correct outcome, and the reason it was built to
  # distinguish "could not look" from "looked and found nothing".
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PIN THE VERSION. The ratchet is a COMPARISON, and comparing findings
      # across two shellcheck releases compares two different questions --
      # releases add checks, retire them, and change directive parsing. Live
      # example from the day this was written: 0.9.0 flags a comment line
      # beginning `# shellcheck` as a malformed directive and 0.10.0 does not,
      # so the same file is clean under one and carries two errors under the
      # other.
      #
      # ubuntu-latest happens to ship 0.9.0 today. Depending on that means the
      # baseline silently changes meaning the day GitHub bumps the image, and
      # the failure would land on whoever's PR was open at the time, looking
      # like their fault. So it is asserted, not assumed: if the runner drifts,
      # THIS step fails with a message naming the cause, instead of the ratchet
      # failing with a message about someone's branch.
      - name: Confirm the linter is present AND is the pinned version
        run: |
          shellcheck --version
          want="$(awk '/^# shellcheck-version /{print $3}' bin/shellcheck-lint.ratchet)"
          got="$(shellcheck --version | awk '/^version:/{print $2}')"
          if [ -z "$want" ]; then
            echo "::error::bin/shellcheck-lint.ratchet records no shellcheck-version -- re-accept it"
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::runner has shellcheck $got, ratchet was accepted with $want."
            echo "The baseline is not comparable across versions. Either pin the runner"
            echo "to $want, or re-accept the ratchet under $got and review what moved."
            exit 1
          fi
          echo "shellcheck $got matches the ratchet."
      - name: Ratchet -- fail only on a finding a file did not already have
        run: bash bin/shellcheck-lint.sh

  # The `surface` job is gone with carry-drift.sh and directive-prose.sh
  # (#511, 2026-08-22). Neither was a required check, and both
  # belonged to the guard layer this repo just removed: six sampled guards
  # were 1,029 lines and produced zero findings. `suites` and `shellcheck`
  # remain separate on purpose -- a required check answering two questions
  # cannot say which one failed.
