# deferral-ledger.yml -- grade a live PR body against bin/lib/body-grammar.sh.
#
# Separate from tests.yml because the subject is the live PR BODY, not the
# checkout. `edited` is not in the default pull_request set and is the most
# important event here: adding the ledger emits `edited` and nothing else, so
# without it an author fixes the finding and watches the check stay red.
# bin/tests/body-grammar.test.sh case I2 pins it.
#
# THE BACKSTOP, NOT THE ENFORCEMENT. gh-sign.sh refuses at `gh pr create`;
# this catches bodies that never passed the shim (mandark is unshimmed, the
# web UI edits afterwards) by running the SAME grammar_check. Not a required
# check on main (markdown-cost, suites, shellcheck are), so it surfaces only.

name: deferral-ledger

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `gh pr view` here rather than github.event.pull_request.body: the event
      # payload is a snapshot from when the run was queued, and `edited` fires
      # in bursts. Reading it back gets the body as it stands now.
      #
      # A body that cannot be read is a RED run, not a green one: a run that
      # could not look has not established that nothing was left behind.
      - name: Does this PR say where the work it deferred went?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            > /tmp/pr-body.md || { echo "BLIND: could not read the PR body"; exit 6; }
          bash bin/gh-sign.sh --check-body /tmp/pr-body.md
