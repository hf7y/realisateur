# deferral-ledger.yml -- grade a live PR body against bin/lib/body-grammar.sh.
#
# WHY A SEPARATE WORKFLOW, and not a job in tests.yml: tests.yml globs
# bin/tests/*.sh and runs suites against the CHECKOUT. This runs against the
# live pull request's BODY, which is not in the checkout and does not change
# when the checkout does. Different subject, different trigger.
#
# THE EVENT LIST IS LOAD-BEARING. `edited` is NOT in the default
# `pull_request` set, and it is the single most important event here: a PR
# body changes with no commit, no push and no `synchronize`. Adding the ledger
# -- the one act that turns this check green -- emits `edited` and nothing
# else. Without it the author would fix the finding and watch the check stay
# red, which is how a guard gets ignored and then deleted.
# bin/tests/body-grammar.test.sh case I2 pins it.
#
# `ready_for_review` is here because a draft is allowed to be incomplete, but
# marking ready IS the completion claim, and "I am done" while deferring
# unfiled work is precisely the claim this repository spent 2026-08-07 making
# ten times.
#
# THIS IS THE BACKSTOP, NOT THE ENFORCEMENT. bin/gh-sign.sh refuses a
# malformed body at `gh pr create`, before it exists. This catches the bodies
# that never passed through the shim: one written from mandark (deliberately
# unshimmed), or edited in the GitHub web UI afterwards. It runs the SAME
# `grammar_check` the shim runs -- one grammar, two readers, no second copy to
# drift. It replaced a 487-line auditor that reimplemented the same rules and
# carried its own `gh` plumbing to reach a body that had already been written.
#
# It is not a required status check on main (`markdown-cost`, `suites` and
# `shellcheck` are, probed 2026-08-15), so a red run here surfaces and does
# not block. The header this file replaced claimed branch protection answered
# 403 on this plan -- it has not since at least 2026-08-11.

name: deferral-ledger

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `gh pr view` here rather than github.event.pull_request.body: the event
      # payload is a snapshot from when the run was queued, and `edited` fires
      # in bursts. Reading it back gets the body as it stands now.
      #
      # A body that cannot be read is a RED run, not a green one: a run that
      # could not look has not established that nothing was left behind.
      - name: Does this PR say where the work it deferred went?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            > /tmp/pr-body.md || { echo "BLIND: could not read the PR body"; exit 6; }
          bash bin/gh-sign.sh --check-body /tmp/pr-body.md
