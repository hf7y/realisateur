name: Rot ratchet

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  rot-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The count of answers nobody acted on may not rise
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ISSUES_TOKEN || secrets.GITHUB_TOKEN }}  # BLIND(3) without a cross-repo token -- #312
        run: bash bin/rot-ratchet.sh
